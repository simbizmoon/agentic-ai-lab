[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-lab"
version = "0.1.0"
description = "Project-based Agentic AI learning lab"
requires-python = ">=3.12"
dependencies = [
    "cryptography",
    "defusedxml",
    "httpx>=0.28,<1",
    "openai",
    "pypdf",
    "python-dotenv",
    "pydantic",
]

[project.scripts]
aira = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false
